name: GNOME Linux validation
on:
  workflow_dispatch:
  push:
    branches: [gnome-ui]
permissions:
  contents: read
concurrency:
  group: gnome-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libasound2-dev libmpv-dev libepoxy-dev
      - name: Resolve upstream dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Regression tests
        run: flutter test --no-pub
      - name: Build Linux
        run: flutter build linux --release --no-pub
      - name: Package Linux bundle
        run: tar -czf Kazumi-gnome-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumi-gnome-linux-x64
          path: Kazumi-gnome-linux-x64.tar.gz
          if-no-files-found: error
